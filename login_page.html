<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Hoạt Hình Trung Quốc 3D</title>
    <link rel="stylesheet" href="./responsive.css">
    <link rel="stylesheet" href="./style_loginpage.css">
</head>

<body>
    <div class="login-form grid">
        <div class="login_form-content row ">
            <div class=" title col l-12 ll-12 m-12 c-12">
                <h1>HoatHinh3D</h1>
            </div>
            <div class="form col">
                <form action="" onsubmit="login(event)">
                    <label for="user" class="">User name</label>
                    <input class="" type="text" name="" id="user">
                    <br><br>
                    <label for="password" class="">Pass word</label>
                    <input class="" type="password" name="" id="password">
                    <button class="">Đăng nhập</button>
                    <button class="register">Nếu bạn chưa có tài khoản hãy đăng ký</button>
                </form>
            </div>
        </div>
    </div>
</body>
<script>
    // set nút "đăng ký" chuyển hướng đến trang đăng ký
    var register = document.querySelector(".register");
    register.addEventListener("click", (event) => {
        event.preventDefault();
        location.href = "./register_page.html";
    });
    // Set event đăng nhập cho "login form"
    function login(event) {
        event.preventDefault();
        var username = document.querySelector("#user").value;
        var password = document.querySelector("#password").value;
        var storage = localStorage.getItem("nguoidung");
        storage = JSON.parse(storage);
        var flag = false;
        storage.forEach((item) => {
            if ((username === item.username) & (password === item.password)) {
                flag = true;
            }
        });
        if (flag) {
            var saveCurrentlyLoggedInUserData = localStorage.setItem(
                "loggedInUser",
                username
            );
            var a = localStorage.getItem("loggedInUser");
            alert("Bạn đăng nhập thành công!");
            location.href = "./index.html";
        } else {
            var saveCurrentlyLoggedInUserData = localStorage.setItem(
                "loggedInUser",
                ""
            );
            alert("Tài khoản và mật khẩu không đúng!");
        }
    }
</script>

</html>
